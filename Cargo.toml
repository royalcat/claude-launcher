[package]
name = "claude-launcher"
version = "0.1.0"
edition = "2024"
description = "Easily manage and switch inference provider configurations for Claude Code"
license = "MIT"

[dependencies]
ratatui = { version = "0.30", features = ["scrolling-regions"] }
ratatui-textarea = { version = "0.9" }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
xdg = { version = "3", features = ["serde"] }
ureq = { version = "3", features = ["json", "platform-verifier", "gzip", "brotli"] }
jiff = { version = "0.2", features = ["serde"] }
heed = "0.22"
itertools = "0.15.0"
iso_currency = "0.7"
