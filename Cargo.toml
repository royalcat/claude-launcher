[package]
name = "claude-launcher"
version = "0.1.0"
edition = "2024"
description = "Easily manage and switch inference provider configurations for Claude Code"
license = "MIT"

[dependencies]
ratatui = "0.30"
ratatui-textarea = { version = "0.9" }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
xdg = "3"
ureq = { version = "3", features = ["platform-verifier", "json"] }
jiff = "0.2"
heed = "0.22"
